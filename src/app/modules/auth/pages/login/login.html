<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo">
            <div class="logo-badge">SI</div>
            <h1>Sistema de Gestión Alimentaria Escolar</h1>
            <p>Universidad Mariano Gálvez de Guatemala</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">

            <div class="field-group">
                <label>Usuario</label>
                <div class="input-wrap" [class.focused]="form.get('username')?.dirty">
                    <mat-icon>person</mat-icon>
                    <input type="text" formControlName="username" placeholder="Tu nombre de usuario"
                        autocomplete="username">
                </div>
                <span class="field-error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
                    Ingresa tu usuario (mínimo 4 caracteres)
                </span>
            </div>

            <div class="field-group">
                <label>Contraseña</label>
                <div class="input-wrap" [class.focused]="form.get('password')?.dirty">
                    <mat-icon>lock</mat-icon>
                    <input [type]="showPass ? 'text' : 'password'" formControlName="password"
                        placeholder="Tu contraseña" autocomplete="current-password">
                    <button type="button" class="eye-btn" (click)="showPass = !showPass" tabindex="-1">
                        <mat-icon>{{ showPass ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </div>
                <span class="field-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                    Ingresa tu contraseña (mínimo 6 caracteres)
                </span>
            </div>

            <div class="login-error" *ngIf="error">
                <mat-icon>error_outline</mat-icon>
                {{ error }}
            </div>

            <button type="submit" class="btn-login" [disabled]="loading">
                <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
                <span *ngIf="!loading">Ingresar al sistema</span>
                <span *ngIf="loading">Verificando...</span>
            </button>

            <nav class="auth-links" aria-label="Opciones de contraseña">
                <a routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
                <a routerLink="/auth/reset-password">Cambiar tu contraseña</a>
            </nav>

        </form>

        <p class="login-footer">© 2025 SIPAE &nbsp;·&nbsp; UMG Guatemala</p>
    </div>
</div>
