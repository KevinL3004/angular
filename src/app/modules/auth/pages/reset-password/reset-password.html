<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo">
            <div class="logo-badge">SI</div>
            <h1>Nueva contraseña</h1>
            <p>Ingresa tu nueva contraseña</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!exito">

            <div class="field-group">
                <label>Nueva contraseña</label>
                <div class="input-wrap">
                    <mat-icon>lock</mat-icon>
                    <input [type]="showPass ? 'text' : 'password'" formControlName="newPassword"
                        placeholder="Mínimo 8 caracteres">
                    <button type="button" class="eye-btn" (click)="showPass = !showPass">
                        <mat-icon>{{ showPass ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </div>
                <span class="field-error" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
                    Mínimo 8 caracteres
                </span>
            </div>

            <div class="field-group">
                <label>Confirmar contraseña</label>
                <div class="input-wrap">
                    <mat-icon>lock_outline</mat-icon>
                    <input [type]="showPass2 ? 'text' : 'password'" formControlName="confirmPassword"
                        placeholder="Repite la contraseña">
                    <button type="button" class="eye-btn" (click)="showPass2 = !showPass2">
                        <mat-icon>{{ showPass2 ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                </div>
                <span class="field-error" *ngIf="form.errors?.['noMatch'] && form.get('confirmPassword')?.touched">
                    Las contraseñas no coinciden
                </span>
            </div>

            <div class="login-error" *ngIf="error">
                <mat-icon>error_outline</mat-icon>{{ error }}
            </div>

            <button type="submit" class="btn-login" [disabled]="loading">
                <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
                <span *ngIf="!loading">Cambiar contraseña</span>
                <span *ngIf="loading">Procesando...</span>
            </button>

            <a routerLink="/auth/login" class="link-volver">
                <mat-icon>arrow_back</mat-icon> Volver al inicio de sesión
            </a>
        </form>

        <!-- Éxito -->
        <div class="success-box" *ngIf="exito">
            <mat-icon class="success-icon">check_circle</mat-icon>
            <p class="success-msg">¡Contraseña actualizada correctamente!</p>
            <p class="success-sub">Redirigiendo al inicio de sesión...</p>
        </div>

    </div>
</div>
