<div class="page">
    <app-page-header title="Escuelas" subtitle="Establecimientos educativos registrados en el sistema">
        <button class="btn-primary" *ngIf="esTecnico">
            <mat-icon>add</mat-icon> Nueva escuela
        </button>
    </app-page-header>

    <app-loading *ngIf="loading"></app-loading>

    <div class="card" *ngIf="!loading">
        <div class="alert danger" *ngIf="error">
            <mat-icon>error_outline</mat-icon> {{ error }}
        </div>

        <app-empty-state *ngIf="!escuelas.length && !error" icon="school" title="Sin escuelas registradas"
            subtitle="Aún no hay escuelas en el sistema">
        </app-empty-state>

        <div class="table-wrap" *ngIf="escuelas.length">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Municipio</th>
                        <th>Departamento</th>
                        <th>Matrícula</th>
                        <th>Estado</th>
                        <th *ngIf="esTecnico"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let e of escuelas">
                        <td><code>{{ e.codigoMineduc }}</code></td>
                        <td class="fw-600">{{ e.nombre }}</td>
                        <td>{{ e.municipio }}</td>
                        <td>{{ e.departamento }}</td>
                        <td>{{ e.matriculaActual }}</td>
                        <td>
                            <span class="badge" [class.green]="e.activa" [class.red]="!e.activa">
                                {{ e.activa ? 'Activa' : 'Inactiva' }}
                            </span>
                        </td>
                        <td *ngIf="esTecnico">
                            <button class="btn-danger" *ngIf="e.activa" (click)="desactivar(e.id)">
                                Desactivar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
