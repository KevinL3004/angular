<aside class="sidebar">

    <div class="sidebar-brand">
        <div class="brand-icon">SI</div>
        <div>
            <div class="brand-name">SIPAE</div>
            <div class="brand-sub">Programa Alimentario</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a *ngFor="let item of navItems()" [routerLink]="item.route" routerLinkActive="active" class="nav-link">

            <span>{{ item.label }}</span>
        </a>
    </nav>

</aside>
